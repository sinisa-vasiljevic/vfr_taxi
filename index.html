<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6c900"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>VfR Taxi</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="stylesheet" href="./styles.css"></head>
<body><div id="toast" class="toast"></div><div id="authView" class="auth-shell"><section class="auth-card"><img src="./icon-192.png" class="auth-icon" alt="VfR Taxi"><h1>VfR Taxi</h1><p>Mannschaftsbus-Verwaltung</p><div class="auth-tabs"><button id="loginTab" class="active">Anmelden</button><button id="registerTab">Registrieren</button></div><form id="authForm"><label>Name<input id="authName" autocomplete="name" placeholder="Vor- und Nachname"></label><label>E-Mail<input id="authEmail" type="email" autocomplete="email" required></label><label>Passwort<input id="authPassword" type="password" minlength="6" autocomplete="current-password" required></label><button class="primary" type="submit" id="authSubmit">Anmelden</button></form><small>Neue Konten starten als Trainer. Adminrechte vergibt der Master-Admin.</small></section></div>
<div id="appView" class="hidden"><header><div class="brand"><img src="./icon-192.png" alt=""><div><b>VfR TAXI</b><small>Mannschaftsbusse</small></div></div><div class="head-actions"><span id="roleBadge"></span><button id="logoutBtn" class="dark">Abmelden</button></div></header><main><section class="stats" id="stats"></section><nav><button data-tab="vehicles" class="active">Fahrzeuge</button><button data-tab="calendar">Belegung</button><button data-tab="requests">Anfragen</button><button data-tab="admin" id="adminTab" class="hidden">Verwaltung</button></nav><section id="content"></section></main><button id="newRequestBtn" class="fab">＋ Bus anfragen</button></div><dialog id="modal"><button class="modal-close" id="closeModal">×</button><div id="modalContent"></div></dialog><script type="module" src="./app.js"></script></body></html>
