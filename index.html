<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6c900"><title>VfR Taxi</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="stylesheet" href="styles.css?v=1.7.6"></head><body><div id="toast"></div><section id="auth" class="auth"><div class="login"><img src="icon-192.png"><h1>VfR Taxi</h1><div class="tabs"><button data-mode="login" class="active">Anmelden</button><button data-mode="register">Mit Einladung registrieren</button></div><form id="authForm"><label class="registerOnly">Name<input id="name"></label><label>E-Mail<input id="email" type="email" required></label><label>Passwort<input id="password" type="password" minlength="6" required></label><label class="registerOnly">Einladungscode<input id="inviteCode" autocomplete="off"></label><button class="primary" id="authSubmit">Anmelden</button></form><small>Trainer registrieren sich nur mit Einladungscode. Der Master meldet sich über „Anmelden“ an.</small></div></section><section id="app" hidden><header><div class="brand"><img src="icon-192.png"><div><b>VfR TAXI</b><small>Mannschaftsbusse</small><small class="headerVersion" id="buildVersion">Version 1.7.6</small></div></div><div><span id="roleBadge"></span> <button id="logout">Abmelden</button></div></header><main><div id="stats" class="stats"></div><nav><button data-tab="vehicles" class="active">Fahrzeuge</button><button data-tab="calendar">Belegung</button><button data-tab="requests">Anfragen</button><button data-tab="users" id="usersTab">Benutzer</button></nav><div id="content"></div></main><button id="newRequest" class="fab">+ Bus anfragen</button></section><dialog id="modal"><button id="close" class="close">×</button><div id="modalBody"></div></dialog><script type="module" src="app.js?v=1.7.6"></script></body></html>
